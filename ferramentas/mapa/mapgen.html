<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
html,body,#m{margin:0;width:100%;height:100%}
.attr{position:absolute;right:0;bottom:0;background:rgba(255,255,255,.85);padding:3px 8px;font:700 11px/1.4 Nunito,sans-serif;color:#333;z-index:5}
.pin{display:grid;place-items:center;border-radius:50%;color:#fff;border:2.5px solid #fff;
  box-shadow:0 2px 6px rgba(0,0,0,.35);font:900 15px/1 Nunito,sans-serif;box-sizing:border-box}
.pin svg{width:58%;height:58%}
.home{background:#FF6B4A;box-shadow:0 0 0 7px rgba(255,107,74,.28),0 3px 8px rgba(0,0,0,.35)}
.food{background:#E89B12}.market{background:#2E9B72}.pharma{background:#7B4FD0}
.hosp{background:#D64550}.metro{background:#3A5BA0}.sight{background:#008991}
</style></head><body><div id="m"></div><script>
var MODE = location.hash.slice(1) || "near";
var G = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-6.5 8 6.5M6.5 9.5V19h11V9.5"/><path d="M10.5 19v-5h3v5"/></svg>',
  food:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M7 3v8M4.5 3v5a2.5 2.5 0 0 0 5 0V3M7 11v10"/><path d="M17 21V3c-2.5 1.5-3.5 4-3.5 7.5V13H17"/></svg>',
  market:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.5l2.2 11h10.5l2-8H6.5"/><circle cx="9" cy="19.5" r="1.4" fill="#fff"/><circle cx="17" cy="19.5" r="1.4" fill="#fff"/></svg>',
  pharma:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M9.5 3h5v6.5H21v5h-6.5V21h-5v-6.5H3v-5h6.5z"/></svg>',
  hosp:'H', metro:'M',
  sight:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4L2.8 9.5l6.4-.8z"/></svg>'
};
var ORDER = {sight:1, food:2, market:3, pharma:4, metro:5, hosp:6, home:9};
Promise.all([fetch("pins.json").then(function(r){return r.json();}),
             fetch("https://tiles.openfreemap.org/styles/liberty").then(function(r){return r.json();})])
.then(function(res){
  var P = res[0], style = res[1], near = MODE === "near";
  /* sem ícones de pontos de interesse (igrejas etc.): só ruas, bairros e nossos pinos */
  style.layers = style.layers.filter(function(l){ return l["source-layer"] !== "poi"; });
  /* nomes em português (o estilo usa o nome em inglês quando existe) e mar no turquesa do site */
  style = JSON.parse(JSON.stringify(style).replace(/"name:en"|"name_en"|"name:latin"|"name_int"/g, '"name"'));
  style.layers.forEach(function(l){
    if(l.id === "water" && l.paint) l.paint["fill-color"] = "#A8DCE0";
  });
  var opt = {container:"m", style:style, attributionControl:false, interactive:false, fadeDuration:0, preserveDrawingBuffer:true};
  if(near){ opt.center = [-43.1800,-22.9668]; opt.zoom = 15.05; }
  else { opt.bounds = [[-43.243,-22.992],[-43.118,-22.888]]; opt.fitBoundsOptions = {padding:30}; }
  var m = new maplibregl.Map(opt);
  m.on("load", function(){
    var b = m.getBounds();
    P.filter(function(p){ return b.contains([p.ll[1],p.ll[0]]) && (near || /home|sight|food|hosp/.test(p.c)); })
     .sort(function(a,c){ return ORDER[a.c]-ORDER[c.c]; })
     .forEach(function(p){
      var s = p.c==="home" ? (near?42:32) : (near?30:22);
      var el = document.createElement("div");
      el.innerHTML = '<div class="pin '+p.c+'" style="width:'+s+'px;height:'+s+'px;font-size:'+(s*.5)+'px">'+G[p.c]+'</div>';
      new maplibregl.Marker({element:el}).setLngLat([p.ll[1],p.ll[0]]).addTo(m);
    });
    m.once("idle", function(){ document.title = "ready"; });
  });
  var at = document.createElement("div"); at.className = "attr";
  at.innerHTML = "© OpenStreetMap · OpenMapTiles · OpenFreeMap"; document.body.appendChild(at);
});
</script></body></html>
