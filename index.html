<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guia de Boas-vindas — Copacabana, Rio de Janeiro</title>
<meta name="description" content="Guia de boas-vindas do apartamento na Rua Felipe de Oliveira, 4 — Copacabana, Rio de Janeiro.">
<meta name="theme-color" content="#0B1A1D">
<meta name="color-scheme" content="light dark">
<script>(function(){var t;try{t=localStorage.getItem("guia_theme")}catch(e){}document.documentElement.setAttribute("data-theme",t==="light"?"light":"dark")})()</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏖️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261017s">
</head>
<body>

<header class="topbar">
  <div class="wrap topbar__in">
    <a class="brand" href="#top">
      <span class="brand__mark" id="brandMark"></span>
      <span class="brand__tx">Felipe de Oliveira, 4<small>Copacabana · Rio</small></span>
    </a>
    <div class="topbar__sp"></div>
    <button type="button" class="themebtn" id="themeBtn"></button>
    <div class="langs" role="group" aria-label="Idioma / Language / Idioma">
      <button type="button" data-lang="pt">PT</button>
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="es">ES</button>
    </div>
  </div>
  <nav class="navchips" aria-label="Seções"><div class="navchips__in" id="nav"></div></nav>
</header>

<main id="top">

  <section class="hero">
    <div class="hero__deco hero__deco--l" id="decoL" aria-hidden="true"></div>
    <div class="hero__deco hero__deco--r" id="decoR" aria-hidden="true"></div>
    <div class="wrap hero__in">
      <div class="hero__tx" id="heroTx"></div>
      <div class="hero__art" id="heroArt"></div>
    </div>
    <div class="wavedge" id="heroWave"></div>
  </section>

  <div class="calcband" aria-hidden="true"></div>

  <section class="gallery" id="galleryWrap" hidden>
    <div class="wrap">
      <div class="sechead" id="galleryHead"></div>
      <div class="gallery__strip" id="galleryStrip"></div>
    </div>
  </section>

  <section class="wrap quick" id="quick"></section>

  <section class="sos" id="sos"></section>

  <section class="wrap menu">
    <div class="sechead" id="menuHead"></div>
    <div class="menu__grid" id="menuGrid"></div>
  </section>

  <div id="sections"></div>

</main>

<div class="calcband" aria-hidden="true"></div>

<footer>
  <div class="foot__deco foot__deco--l" id="decoFL" aria-hidden="true"></div>
  <div class="foot__deco foot__deco--r" id="decoFR" aria-hidden="true"></div>
  <div class="wrap foot" id="foot"></div>
</footer>

<button class="totop" id="toTop" aria-label="Topo"></button>

<nav class="tabbar" id="tabbar" aria-label="Atalhos"></nav>

<script src="art.js?v=20261017s"></script>
<script src="data.js?v=20261017s"></script>
<script src="lang-pt.js?v=20261017s"></script>
<script src="lang-en.js?v=20261017s"></script>
<script src="lang-es.js?v=20261017s"></script>
<script src="app.js?v=20261017s"></script>
</body>
</html>
